<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Event Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.3;
            pointer-events: none;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        
        .form-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #8b5cf6;
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #6d28d9;
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .form-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }
        
        .form-header p {
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #334155;
            font-size: 0.85rem;
        }
        
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.2s;
            background: white;
            font-family: inherit;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(107, 70, 193, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .otp-section {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        
        .otp-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .error {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85rem;
        }
        
        .success {
            background: #f0fdf4;
            color: #16a34a;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85rem;
        }
        
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.4s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .resend-link {
            color: #8b5cf6;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
        }
        
        .resend-link:hover {
            text-decoration: underline;
        }
        
        .timer {
            color: #ff9800;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <a href="/login" class="back-link">← Back to Login</a>
            
            <div class="form-header">
                <h2>Reset Password</h2>
                <p>Enter your email to receive OTP</p>
            </div>
            
            <div id="errorMsg" class="error" style="display: none;"></div>
            <div id="successMsg" class="success" style="display: none;"></div>
            
            <!-- Step 1: Email Input -->
            <div id="step1">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your registered email" required>
                </div>
                <button class="btn" id="sendOtpBtn" onclick="sendOTP()">Send OTP</button>
            </div>
            
            <!-- Step 2: OTP Verification -->
            <div id="step2" class="otp-section">
                <div class="input-group">
                    <label>Enter OTP</label>
                    <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6">
                </div>
                <button class="btn" id="verifyOtpBtn" onclick="verifyOTP()">Verify OTP</button>
                <div class="resend-link" id="resendLink" onclick="resendOTP()">Resend OTP <span id="timer" class="timer"></span></div>
            </div>
            
            <!-- Step 3: New Password -->
            <div id="step3" class="otp-section">
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password">
                    <small style="color: #666;">8+ chars, uppercase, lowercase, number</small>
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password">
                </div>
                <button class="btn" id="resetBtn" onclick="resetPassword()">Reset Password</button>
            </div>
        </div>
    </div>
    
    <script>
        let isOtpVerified = false;
        let userEmail = '';
        let timerInterval = null;
        let secondsLeft = 0;
        
        function showMessage(msg, type) {
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (type === 'error') {
                errorDiv.innerHTML = msg;
                errorDiv.style.display = 'block';
            } else if (type === 'success') {
                successDiv.innerHTML = msg;
                successDiv.style.display = 'block';
            }
            
            // Auto hide after 3 seconds
            setTimeout(() => {
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
            }, 3000);
        }
        
        async function sendOTP() {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showMessage('Please enter your email', 'error');
                return;
            }
            
            userEmail = email;
            
            const btn = document.getElementById('sendOtpBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> Sending...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email})
                });
                
                const data = await response.json();
                
                // Instant button reset
                btn.innerHTML = originalText;
                btn.disabled = false;
                
                if (response.ok) {
                    showMessage(data.message, 'success');
                    document.getElementById('step2').classList.add('active');
                    startTimer(60);
                    document.getElementById('otp').focus();
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                showMessage('Error sending OTP', 'error');
            }
        }
        
        async function verifyOTP() {
            const otp = document.getElementById('otp').value.trim();
            
            if (!otp || otp.length !== 6) {
                showMessage('Please enter 6-digit OTP', 'error');
                return;
            }
            
            const btn = document.getElementById('verifyOtpBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> Verifying...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/verify-reset-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: userEmail, otp: otp})
                });
                
                const data = await response.json();
                
                // Instant button reset
                btn.innerHTML = originalText;
                btn.disabled = false;
                
                if (response.ok) {
                    isOtpVerified = true;
                    showMessage(data.message, 'success');
                    document.getElementById('step3').classList.add('active');
                    document.getElementById('newPassword').focus();
                    
                    if (timerInterval) {
                        clearInterval(timerInterval);
                    }
                } else {
                    showMessage(data.error, 'error');
                    document.getElementById('otp').value = '';
                    document.getElementById('otp').focus();
                }
            } catch (error) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                showMessage('Error verifying OTP', 'error');
            }
        }
        
        async function resetPassword() {
            if (!isOtpVerified) {
                showMessage('Please verify OTP first', 'error');
                return;
            }
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!newPassword) {
                showMessage('Please enter new password', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            // Password strength check
            if (newPassword.length < 8) {
                showMessage('Password must be at least 8 characters', 'error');
                return;
            }
            
            const btn = document.getElementById('resetBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> Resetting...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/reset-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: userEmail, new_password: newPassword})
                });
                
                const data = await response.json();
                
                btn.innerHTML = originalText;
                btn.disabled = false;
                
                if (response.ok) {
                    showMessage(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = '/login?success=Password reset successful! Please login.';
                    }, 1500);
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                showMessage('Error resetting password', 'error');
            }
        }
        
        async function resendOTP() {
            if (!userEmail) return;
            
            const btn = document.getElementById('resendLink');
            btn.innerHTML = 'Sending...';
            btn.style.pointerEvents = 'none';
            
            try {
                const response = await fetch('/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: userEmail})
                });
                
                const data = await response.json();
                
                btn.innerHTML = 'Resend OTP <span id="timer" class="timer"></span>';
                btn.style.pointerEvents = 'auto';
                
                if (response.ok) {
                    showMessage('OTP resent!', 'success');
                    startTimer(60);
                } else {
                    showMessage(data.error, 'error');
                }
            } catch (error) {
                btn.innerHTML = 'Resend OTP <span id="timer" class="timer"></span>';
                btn.style.pointerEvents = 'auto';
                showMessage('Error resending OTP', 'error');
            }
        }
        
        function startTimer(seconds) {
            secondsLeft = seconds;
            const timerElement = document.getElementById('timer');
            const resendLink = document.getElementById('resendLink');
            
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            resendLink.style.pointerEvents = 'none';
            resendLink.style.opacity = '0.5';
            
            timerInterval = setInterval(() => {
                if (secondsLeft <= 0) {
                    clearInterval(timerInterval);
                    timerElement.textContent = '';
                    resendLink.style.pointerEvents = 'auto';
                    resendLink.style.opacity = '1';
                } else {
                    timerElement.textContent = ` (${secondsLeft}s)`;
                    secondsLeft--;
                }
            }, 1000);
        }
        
        // Auto-verify when 6 digits entered
        document.getElementById('otp').addEventListener('input', function(e) {
            if (this.value.length === 6 && !isOtpVerified) {
                verifyOTP();
            }
        });
    </script>
</body>
</html>
